[package]
name = "twl"
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
description = "Keep project credentials out of coding-agent processes"
license = "Apache-2.0"
repository = "https://github.com/luciobaiocchi/twl"
homepage = "https://luciobaiocchi.github.io/twl/"
readme = "README.md"
keywords = ["security", "secrets", "ai-agents", "proxy", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
default-run = "twl"

[[bin]]
name = "twl"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
tiny_http = "0.12"
ureq = "2"
rand = "0.8"
rpassword = "7"
base64 = "0.22"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
