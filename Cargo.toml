[package]
name = "twl"
version = "0.1.0-dev.0"
edition = "2021"
rust-version = "1.82"
description = "Keep project credentials out of coding-agent processes"
license = "Apache-2.0"
repository = "https://github.com/luciobaiocchi/twl"
homepage = "https://luciobaiocchi.github.io/twl/"
readme = "README.md"
keywords = ["security", "secrets", "ai-agents", "proxy", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
default-run = "twl"

[[bin]]
name = "twl"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tiny_http = "0.12"
ureq = "2"
rand = "0.8"
rpassword = "7"
base64 = "0.23"
url = "2"
zeroize = { version = "1", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
age = { version = "0.11.1", default-features = false }
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext"] }
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
