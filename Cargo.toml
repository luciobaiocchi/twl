[package]
name = "capshell"
version = "0.0.1"
edition = "2021"
description = "L'agente non vede le tue chiavi API"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tiny_http = "0.12"
ureq = "2"
rand = "0.8"
rpassword = "7"

# Solo macOS e Windows: li' il portachiavi si raggiunge dalla libreria, e su
# macOS e' obbligatorio perche' la ACL del Keychain e' legata alla firma del
# binario che chiede. Su Linux si chiama `secret-tool` (vedi src/secret.rs):
# stesso portachiavi, 79 crate in meno, e nessuna garanzia persa.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
