[package]
name = "mithril"
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
description = "Local project-credential broker for coding agents"
license = "Apache-2.0"
default-run = "mtl"

[[bin]]
name = "mtl"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tiny_http = "0.12"
ureq = "2"
rand = "0.8"
rpassword = "7"
base64 = "0.22"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
