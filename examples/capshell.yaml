# Test config: points at the fake provider instead of OpenAI, so the whole
# round trip can be seen without spending money and without a real key.
#
#   capshell mock-upstream --port 9000
#   capshell run --config examples/capshell.yaml --env examples/dev.env -- sh
#
# In production, drop `upstream:` and the connector uses its hardwired host.

secrets:
  - name: OPENAI_API_KEY
    connector: openai
    upstream: http://127.0.0.1:9000

budget:
  max_requests: 5
