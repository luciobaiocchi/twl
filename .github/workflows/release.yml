name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options: [all, linux-only]
        default: all
      tag:
        description: >-
          Release tag, for example v0.1.0-alpha.1. Must match the version in
          Cargo.toml. Created on the selected branch once the build passes.
          Leave empty for a dry run that builds and checks everything and
          publishes nothing.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Verify release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimum supported Rust
        run: rustup toolchain install 1.82.0 --profile minimal --component rustfmt,clippy

      - name: Match tag to Cargo version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          # The tag is the release identity, so it must agree with Cargo.toml
          # whether it already exists or is about to be created. Without a tag
          # this is a dry run, which builds everything and publishes nothing.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v${version}" = "$GITHUB_REF_NAME"
            tag="$GITHUB_REF_NAME"
            publish=true
          elif [ -n "$INPUT_TAG" ]; then
            if [ "v${version}" != "$INPUT_TAG" ]; then
              echo "::error::tag $INPUT_TAG does not match Cargo.toml version $version; expected v$version"
              exit 1
            fi
            tag="$INPUT_TAG"
            publish=true
          else
            tag="v${version}"
            publish=false
            echo "::notice::dry run from ${GITHUB_REF_NAME}; nothing will be published"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"

          # A silently missing platform is worse than a loud one.
          if [ "$MACOS_RELEASE" = "true" ]; then
            echo "::notice::$tag will build Linux and macOS"
          else
            echo "::notice::$tag will build Linux only; set the MACOS_RELEASE repository variable to \"true\" to include macOS"
          fi
        env:
          MACOS_RELEASE: ${{ vars.MACOS_RELEASE }}
          INPUT_TAG: ${{ inputs.tag }}

      - name: Verify tagged source
        run: |
          cargo +1.82.0 fmt --all -- --check
          cargo +1.82.0 test --all-targets --locked
          cargo +1.82.0 clippy --all-targets --all-features --locked -- -D warnings
          cargo +1.82.0 package --locked

  linux:
    name: Linux (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build target
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add "${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          name="twl-${{ needs.verify-version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/twl" README.md LICENSE NOTICE "dist/$name/"
          # A musl artifact that still needs an interpreter will not run on the
          # distributions this target exists to support.
          if file -b "dist/$name/twl" | grep -q "dynamically linked"; then
            echo "::error::$name is dynamically linked; expected a static musl build"
            exit 1
          fi
          # Both runners are native, so the packaged binary can be exercised
          # directly. doctor opens the vault directory, which is the part most
          # likely to break in a stripped release build. It reports failures on
          # stdout and always exits 0 so that dev builds can run it, so assert
          # on the line rather than the status.
          "dist/$name/twl" doctor | tee "$RUNNER_TEMP/doctor.txt"
          if ! grep -q "encrypted Linux project sessions: available" "$RUNNER_TEMP/doctor.txt"; then
            echo "::error::$name cannot open the encrypted vault"
            exit 1
          fi
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: twl-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.target }})
    needs: verify-version
    # Opt-in. Signing and notarization need credentials and an entitlement
    # configuration that has not been exercised on a Developer ID build yet, so
    # a tag must be able to ship Linux on its own. Set the MACOS_RELEASE
    # repository variable to "true" once that path is verified; until then this
    # job never runs and publish still produces a Linux-only prerelease.
    if: >-
      vars.MACOS_RELEASE == 'true'
      && (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all')
    runs-on: ${{ matrix.runner }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build target
        run: rustup target add "${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["RUNNER_TEMP"], "developer-id.p12").write_bytes(
              base64.b64decode(os.environ["CERTIFICATE_P12_BASE64"])
          )
          PY
          keychain="$RUNNER_TEMP/twl-signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Sign, notarize, and package
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # A missing secret expands to an empty string, which set -u does not
          # catch. Without this guard the entitlements get an empty Team ID,
          # codesign still succeeds, and every project command in the released
          # binary fails closed at runtime.
          case "${APPLE_TEAM_ID:-}" in
            "" | *[!A-Za-z0-9]*)
              echo "::error::APPLE_TEAM_ID is missing or not alphanumeric"
              exit 1
              ;;
          esac
          name="twl-${{ needs.verify-version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/twl" README.md LICENSE NOTICE "dist/$name/"
          entitlements="$RUNNER_TEMP/twl.entitlements"
          sed "s/__TEAM_ID__/$APPLE_TEAM_ID/g" config/macos.entitlements >"$entitlements"
          codesign --force --options runtime --timestamp \
            --entitlements "$entitlements" \
            --sign "$APPLE_SIGNING_IDENTITY" "dist/$name/twl"
          codesign --verify --strict --verbose=2 "dist/$name/twl"
          codesign -d --entitlements - "dist/$name/twl"
          # doctor reports an unusable Keychain on stdout and still exits 0, so
          # assert on the line. This is the only automated check that the signed
          # entitlements and access group actually work; without it a binary
          # that fails closed on every project command still ships.
          "dist/$name/twl" doctor | tee "$RUNNER_TEMP/doctor.txt"
          if ! grep -q "protected macOS project sessions: available" "$RUNNER_TEMP/doctor.txt"; then
            echo "::error::$name cannot open the protected Keychain store"
            exit 1
          fi
          ditto -c -k --keepParent "dist/$name" "dist/$name.zip"
          python3 - <<'PY'
          import base64, os, pathlib
          key_id = os.environ["APPLE_API_KEY_ID"]
          pathlib.Path(os.environ["RUNNER_TEMP"], f"AuthKey_{key_id}.p8").write_bytes(
              base64.b64decode(os.environ["APPLE_API_KEY_P8_BASE64"])
          )
          PY
          xcrun notarytool submit "dist/$name.zip" \
            --key "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/twl-signing.keychain-db" || true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: twl-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    needs: [verify-version, linux, macos]
    # macos is skipped for a linux-only run, which would skip this job too
    # without always(). A dry run stops here: verify-version only sets publish
    # when a tag was pushed or a matching one was named.
    if: >-
      always()
      && needs.verify-version.result == 'success'
      && needs.linux.result == 'success'
      && needs.macos.result != 'failure'
      && needs.macos.result != 'cancelled'
      && needs.verify-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # A linux-only run produces no .zip, and an unmatched glob would
          # otherwise reach sha256sum as a literal path and fail the job.
          shopt -s nullglob
          artifacts=(./*.tar.gz ./*.zip)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "::error::no release artifacts were downloaded"
            exit 1
          fi
          sha256sum "${artifacts[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*

      - name: Create the release tag
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Created here rather than in verify-version so that a build which
          # fails its artifact checks never leaves a tag behind. A ref created
          # with GITHUB_TOKEN does not re-trigger this workflow.
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            --jq .object.sha 2>/dev/null); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::tag $TAG already exists and points at $existing, not $GITHUB_SHA"
              exit 1
            fi
            echo "::notice::tag $TAG already points at this commit"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
            echo "::notice::created tag $TAG at $GITHUB_SHA"
          fi

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-version.outputs.tag }}
          MACOS_RESULT: ${{ needs.macos.result }}
        shell: bash
        run: |
          set -euo pipefail
          notes=$RUNNER_TEMP/notes.md
          if [ "$MACOS_RESULT" = "skipped" ]; then
            printf '%s\n\n' \
              "Linux only. This prerelease carries no macOS artifact." >"$notes"
          else
            : >"$notes"
          fi
          # A release can already exist if it was drafted through the Releases
          # page, which creates the tag and triggers this workflow. Attach the
          # artifacts to it instead of failing.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::release $TAG exists; uploading artifacts to it"
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Towel $TAG" \
              --notes-file "$notes" \
              --generate-notes \
              --prerelease \
              --verify-tag
          fi
